[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "all-os-commands"
version = "0.1.0"
description = "Small cross-platform console helpers."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "camm_pro contributors" }
]
license = { text = "MIT" }

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["AllOsCommands*"]
